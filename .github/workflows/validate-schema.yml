name: Validate JSON Schema and Examples

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    # 1. Repository-Code auschecken (Aktualisiert auf v4, kompatibel mit Node 24)
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Node.js installieren (Angehoben auf Version 24, da Node 20 EOL ist)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # 3. Den offiziellen Ajv-CLI-Validator global installieren
    - name: Install JSON Schema Validator (Ajv)
      run: npm install -g ajv-cli ajv-formats

    # 4. Das Schema selbst auf syntaktische Korrektheit prüfen
    - name: Validate Schema Definition
      run: ajv compile -s schema.json -c ajv-formats

    # 5. Positivtest: Valide Beispiele MÜSSEN erfolgreich sein
    - name: Validate Positive Examples (Must Pass)
      run: ajv validate -s schema.json -d "examples/valid-*.json" -c ajv-formats

    # 6. Negativtest: Invalide Beispiele MÜSSEN fehlschlagen
    - name: Validate Negative Examples (Must Fail)
  shell: bash
  run: |
    if ajv validate -s schema.json -d "examples/invalid-*.json" -c ajv-formats; then
      echo "ERROR: invalid example unexpectedly passed validation"
      exit 1
    else
      echo "OK: invalid example failed validation as expected"
    fi
